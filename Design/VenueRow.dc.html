<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isRow }}">
<div onClick="{{ venue.open }}" style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:0.5px solid #E3E1EF;cursor:pointer;box-sizing:border-box">
<dc-import name="CategoryIcon" category="{{ venue.category }}" size="44" hint-size="44px,44px"></dc-import>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<div style="font-size:14px;font-weight:500;color:#241B4E;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ venue.name }}</div>
<div style="font-size:12px;color:#8C87A6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ venue.subLabel }}</div>
</div>
<sc-if value="{{ venue.slotLabel }}"><div style="background:{{ venue.slotBg }};color:{{ venue.slotFg }};font-size:10px;padding:5px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0">{{ venue.slotLabel }}</div></sc-if>
</div>
</sc-if>
<sc-if value="{{ isCard }}">
<div onClick="{{ venue.open }}" style="display:flex;gap:12px;align-items:center;background:#FFFFFF;border-radius:18px;padding:12px;box-sizing:border-box;cursor:pointer">
<dc-import name="CategoryIcon" category="{{ venue.category }}" size="64" hint-size="64px,64px"></dc-import>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
<div style="font-size:14px;font-weight:500;color:#241B4E">{{ venue.name }}</div>
<div style="font-size:11px;color:#8C87A6">★ {{ venue.rating }} ({{ venue.reviews }}) · {{ venue.area }}</div>
</div>
<sc-if value="{{ venue.slotLabel }}"><div style="background:{{ venue.slotBg }};color:{{ venue.slotFg }};font-size:10px;padding:5px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0">{{ venue.slotLabel }}</div></sc-if>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:80},&quot;venue&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;row&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;row&quot;,&quot;card&quot;]}}">
class Component extends DCLogic {
  renderVals() {
    const variant = this.props.variant || 'row';
    return { isRow: variant !== 'card', isCard: variant === 'card', venue: this.props.venue || {} };
  }
}
</script>
</body>
</html>
