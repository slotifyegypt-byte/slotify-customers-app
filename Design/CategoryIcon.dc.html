<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:{{ sizePx }}px;height:{{ sizePx }}px;border-radius:999px;background:{{ bg }};display:flex;align-items:center;justify-content:center;flex-shrink:0;box-sizing:border-box">
<sc-if value="{{ isBarbers }}"><svg width="{{ iconPx }}" height="{{ iconPx }}" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="6" r="2.6" stroke="{{ fg }}" stroke-width="1.6"></circle><circle cx="6" cy="18" r="2.6" stroke="{{ fg }}" stroke-width="1.6"></circle><line x1="8.3" y1="7.8" x2="20" y2="18" stroke="{{ fg }}" stroke-width="1.6" stroke-linecap="round"></line><line x1="8.3" y1="16.2" x2="20" y2="6" stroke="{{ fg }}" stroke-width="1.6" stroke-linecap="round"></line></svg></sc-if>
<sc-if value="{{ isSalons }}"><svg width="{{ iconPx }}" height="{{ iconPx }}" viewBox="0 0 24 24" fill="none"><rect x="3" y="5.5" width="11" height="7" rx="3.5" stroke="{{ fg }}" stroke-width="1.6"></rect><path d="M13 6.5L18.5 9L13 11.5Z" fill="{{ fg }}"></path><rect x="6" y="12.5" width="4" height="7.5" rx="2" stroke="{{ fg }}" stroke-width="1.6"></rect><line x1="19.5" y1="6.3" x2="22.3" y2="5.2" stroke="{{ fg }}" stroke-width="1.4" stroke-linecap="round"></line><line x1="20" y1="9" x2="23" y2="9" stroke="{{ fg }}" stroke-width="1.4" stroke-linecap="round"></line><line x1="19.5" y1="11.7" x2="22.3" y2="12.8" stroke="{{ fg }}" stroke-width="1.4" stroke-linecap="round"></line></svg></sc-if>
<sc-if value="{{ isSpa }}"><svg width="{{ iconPx }}" height="{{ iconPx }}" viewBox="0 0 24 24" fill="none"><path d="M12 3C9.5 7 9.3 12 12 15.5C14.7 12 14.5 7 12 3Z" fill="{{ fg }}"></path><path d="M11.3 15.3C7.8 14.6 5 11.8 4 8.2C7.7 8 10.8 10.3 11.3 15.3Z" fill="{{ fg }}"></path><path d="M12.7 15.3C16.2 14.6 19 11.8 20 8.2C16.3 8 13.2 10.3 12.7 15.3Z" fill="{{ fg }}"></path><line x1="5.5" y1="18.5" x2="18.5" y2="18.5" stroke="{{ fg }}" stroke-width="1.6" stroke-linecap="round"></line></svg></sc-if>
<sc-if value="{{ isCarcare }}"><svg width="{{ iconPx }}" height="{{ iconPx }}" viewBox="0 0 24 24" fill="none"><path d="M4 16V13.5L6.2 11.3H15.8L18 13.5V16" stroke="{{ fg }}" stroke-width="1.5" stroke-linejoin="round"></path><line x1="2" y1="16" x2="20" y2="16" stroke="{{ fg }}" stroke-width="1.5" stroke-linecap="round"></line><circle cx="7" cy="16.3" r="1.7" fill="{{ fg }}"></circle><circle cx="15" cy="16.3" r="1.7" fill="{{ fg }}"></circle><path d="M18.5 4L19.3 6L21.3 6.8L19.3 7.6L18.5 9.6L17.7 7.6L15.7 6.8L17.7 6Z" fill="{{ fg }}"></path></svg></sc-if>
<sc-if value="{{ isTailors }}"><svg width="{{ iconPx }}" height="{{ iconPx }}" viewBox="0 0 24 24" fill="none"><line x1="18" y1="4" x2="6" y2="19" stroke="{{ fg }}" stroke-width="1.7" stroke-linecap="round"></line><circle cx="16.8" cy="5.7" r="1.7" stroke="{{ fg }}" stroke-width="1.3"></circle><path d="M15.5 7.5C11.5 9.3 13.5 12 9.5 14C6.8 15.3 8.2 17.3 6 19" stroke="{{ fg }}" stroke-width="1.3" stroke-linecap="round"></path></svg></sc-if>
<sc-if value="{{ isRepair }}"><svg width="{{ iconPx }}" height="{{ iconPx }}" viewBox="0 0 24 24" fill="none"><path d="M6.3 5.8a3 3 0 104 4L18 18l2.3-2.3-7.7-7.7a3 3 0 10-6.3-2.2z" stroke="{{ fg }}" stroke-width="1.5" stroke-linejoin="round"></path><line x1="18" y1="6" x2="6" y2="18" stroke="{{ fg }}" stroke-width="1.8" stroke-linecap="round"></line><rect x="16.2" y="3.8" width="4" height="4" rx="1" transform="rotate(45 18.2 5.8)" fill="{{ fg }}"></rect></svg></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:64,&quot;height&quot;:64},&quot;category&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;barbers&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;barbers&quot;,&quot;salons&quot;,&quot;spa&quot;,&quot;carcare&quot;,&quot;tailors&quot;,&quot;repair&quot;]},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:52,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:24,&quot;max&quot;:96},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;muted&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const CAT_MAP = {
  barbers: { bg: '#EEF3FC', fg: '#4C6FD1' },
  salons: { bg: '#FBEAF0', fg: '#C4517C' },
  spa: { bg: '#E7E4FA', fg: '#4C41A8' },
  carcare: { bg: '#E1F5EE', fg: '#0F6E56' },
  tailors: { bg: '#FAEDE4', fg: '#A8511F' },
  repair: { bg: '#FCEEDC', fg: '#854F0B' },
};
class Component extends DCLogic {
  renderVals() {
    const cat = this.props.category || 'barbers';
    const size = this.props.size || 52;
    const base = CAT_MAP[cat] || CAT_MAP.barbers;
    const t = this.props.selected ? { bg: '#7C6FF0', fg: '#FFFFFF' } : (this.props.muted ? { bg: '#EDEBF5', fg: '#B7B2C9' } : base);
    return {
      sizePx: size,
      iconPx: Math.round(size * 0.4),
      bg: t.bg,
      fg: t.fg,
      isBarbers: cat === 'barbers',
      isSalons: cat === 'salons',
      isSpa: cat === 'spa',
      isCarcare: cat === 'carcare',
      isTailors: cat === 'tailors',
      isRepair: cat === 'repair',
    };
  }
}
</script>
</body>
</html>
